<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>சர்வநிச்சயம் செய்திகள்</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --card: #ffffff;
      --text: #1c1917;
      --muted: #57534e;
      --border: #e7e5e4;
      --primary: #991b1b;
      --primary-dark: #7f1d1d;
    }
    body.dark {
      --bg: #12100e;
      --card: #1e1b18;
      --text: #f5f5f4;
      --muted: #a8a29e;
      --border: #2e2a26;
      --primary: #dc2626;
      --primary-dark: #b91c1c;
    }
    * { box-sizing: border-box; font-family: "Noto Sans Tamil", system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.65; transition: background 0.2s, color 0.2s; }
    .container { max-width: 960px; margin: 0 auto; padding: 16px; }
    .top-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); margin-bottom: 14px; }
    .live-badge { background: var(--primary); color: #fff; padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: 12px; }
    .header-card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 18px; margin-bottom: 14px; box-shadow: 0 4px 14px rgba(0,0,0,0.04); }
    .brand-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
    .brand-left { display: flex; align-items: center; gap: 12px; }
    .logo-box { width: 48px; height: 48px; border-radius: 12px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; flex-shrink: 0; }
    .brand-title { font-size: 22px; font-weight: 800; margin: 0; }
    .brand-sub { font-size: 13px; color: var(--muted); margin: 2px 0 0; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn { border: none; border-radius: 10px; padding: 9px 14px; font-size: 13px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .breaking-bar { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 10px 14px; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; overflow: hidden; }
    .breaking-tag { background: var(--primary); color: #fff; padding: 3px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; flex-shrink: 0; }
    .breaking-text { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
    .hero-banner { border-radius: 18px; overflow: hidden; margin-bottom: 16px; border: 1px solid var(--border); box-shadow: 0 8px 22px rgba(0, 0, 0, 0.14); background: var(--card); }
    .hero-banner img { display: block; width: 100%; height: auto; max-height: 400px; object-fit: cover; object-position: center top; }
    .cats { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; }
    .cat-btn { border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .cat-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .search-input { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 14px; margin-bottom: 16px; outline: none; }
    .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .section-head h3 { margin: 0; font-size: 18px; }
    .count-pill { background: var(--card); border: 1px solid var(--border); padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: transform 0.15s; }
    .card:hover { transform: translateY(-2px); }
    .card img { width: 100%; height: 180px; object-fit: cover; background: #292524; }
    .card-body { padding: 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .card-cat { font-size: 12px; font-weight: 700; color: var(--primary); }
    .card-title { font-size: 16px; font-weight: 800; margin: 0; }
    .card-desc { font-size: 14px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; }
