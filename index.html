<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>சர்வநிச்சயம் செய்திகள்</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --card: #ffffff;
      --text: #1c1917;
      --muted: #57534e;
      --border: #e7e5e4;
      --primary: #991b1b;
      --primary-dark: #7f1d1d;
    }
    body.dark {
      --bg: #12100e;
      --card: #1e1b18;
      --text: #f5f5f4;
      --muted: #a8a29e;
      --border: #2e2a26;
      --primary: #dc2626;
      --primary-dark: #b91c1c;
    }
    * { box-sizing: border-box; font-family: "Noto Sans Tamil", system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.65; transition: background 0.2s, color 0.2s; }
    .container { max-width: 960px; margin: 0 auto; padding: 16px; }
    .top-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); margin-bottom: 14px; }
    .live-badge { background: var(--primary); color: #fff; padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: 12px; }
    .header-card { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 18px; margin-bottom: 14px; box-shadow: 0 4px 14px rgba(0,0,0,0.04); }
    .brand-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
    .brand-left { display: flex; align-items: center; gap: 12px; }
    .logo-box { width: 48px; height: 48px; border-radius: 12px; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; flex-shrink: 0; }
    .brand-title { font-size: 22px; font-weight: 800; margin: 0; }
    .brand-sub { font-size: 13px; color: var(--muted); margin: 2px 0 0; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn { border: none; border-radius: 10px; padding: 9px 14px; font-size: 13px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .breaking-bar { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 10px 14px; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; overflow: hidden; }
    .breaking-tag { background: var(--primary); color: #fff; padding: 3px 10px; border-radius: 8px; font-size: 12px; font-weight: 700; flex-shrink: 0; }
    .breaking-text { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
    .hero-banner { border-radius: 18px; overflow: hidden; margin-bottom: 16px; border: 1px solid var(--border); box-shadow: 0 8px 22px rgba(0, 0, 0, 0.14); background: var(--card); }
    .hero-banner img { display: block; width: 100%; height: auto; max-height: 400px; object-fit: cover; object-position: center top; }
    .cats { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; }
    .cat-btn { border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .cat-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .search-input { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-size: 14px; margin-bottom: 16px; outline: none; }
    .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 8px; flex-wrap: wrap; }
    .section-head h3 { margin: 0; font-size: 18px; }
    .count-pill { background: var(--card); border: 1px solid var(--border); padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .notice-bar { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; display: none; }
    body.dark .notice-bar { background: #2a1414; color: #fca5a5; border-color: #7f1d1d; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; cursor: pointer; transition: transform 0.15s; }
    .card:hover { transform: translateY(-2px); }
    .card img { width: 100%; height: 180px; object-fit: cover; background: #292524; }
    .card-body { padding: 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .card-cat { font-size: 12px; font-weight: 700; color: var(--primary); }
    .card-title { font-size: 16px; font-weight: 800; margin: 0; }
    .card-desc { font-size: 14px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; }
    .card-meta { font-size: 12px; color: var(--muted); margin-top: auto; padding-top: 8px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; }
    .card-actions { display: flex; align-items: center; gap: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
    .icon-action-btn { display: inline-flex; align-items: center; gap: 5px; background: transparent; border: 1px solid var(--border); color: var(--text); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; cursor: pointer; }
    .icon-action-btn.liked { border-color: var(--primary); color: var(--primary); }
    .empty-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px; text-align: center; color: var(--muted); grid-column: 1 / -1; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.65); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
    .modal-backdrop.open { display: flex; }
    .modal-box { background: var(--card); color: var(--text); border-radius: 18px; max-width: 680px; width: 100%; max-height: 88vh; overflow-y: auto; padding: 20px; border: 1px solid var(--border); }
    .modal-box img { width: 100%; max-height: 320px; object-fit: cover; border-radius: 12px; margin-bottom: 12px; }
    .modal-text { white-space: pre-line; font-size: 15px; line-height: 1.8; margin: 12px 0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <span class="live-badge">● சர்வநிச்சயம் செய்திகள்</span>
      <span id="clockText"></span>
    </div>

    <div class="header-card">
      <div class="brand-row">
        <div class="brand-left">
          <div class="logo-box">ச</div>
          <div>
            <h1 class="brand-title">சர்வநிச்சயம் செய்திகள்</h1>
            <p class="brand-sub">இலங்கைச் செய்திகள் · உலகச் செய்திகள் · கட்டுரை · கலை இலக்கியம்</p>
          </div>
        </div>
        <div class="actions">
          <a href="admin.html" class="btn btn-primary">✎ செய்தி போட</a>
          <button type="button" class="btn btn-outline" onclick="loadNews(true)">↻ புதுப்பி</button>
          <button type="button" class="btn btn-outline" id="themeBtn" onclick="toggleTheme()">🌙 இரவு</button>
        </div>
      </div>
    </div>

    <div class="notice-bar" id="statusNotice"></div>

    <div class="breaking-bar" id="breakingBar" style="display:none;">
      <span class="breaking-tag">சிறப்புச் செய்தி</span>
      <span class="breaking-text" id="breakingText"></span>
    </div>

    <div class="hero-banner">
      <img src="cover.jpg?v=20261124" alt="சர்வநிச்சயம் செய்திகள்" onerror="this.parentElement.style.display='none'" />
    </div>

    <div class="cats" id="categoryTabs"></div>
    <input type="search" class="search-input" id="searchInput" placeholder="செய்திகள், தலைப்புகள் அல்லது பிரிவுகளைத் தேடவும்..." oninput="applyFilters()" />

    <div class="section-head">
      <h3>சமீபத்திய செய்திகள்</h3>
      <span class="count-pill" id="newsCount">0 செய்திகள்</span>
    </div>

    <div class="grid" id="newsGrid"></div>
  </div>

  <div class="modal-backdrop" id="newsModal" onclick="closeModal(event)">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <span class="card-cat" id="modalCat"></span>
        <button type="button" class="btn btn-outline" onclick="closeModal()">✕ மூடு</button>
      </div>
      <img id="modalImg" src="" alt="" style="display:none;" />
      <h2 id="modalTitle" style="margin:0 0 8px;font-size:20px;"></h2>
      <div class="card-meta" id="modalMeta" style="border:none;padding:0;"></div>
      <div class="modal-text" id="modalDesc"></div>
      <div id="modalActions" class="card-actions" style="margin-top:12px;"></div>
    </div>
  </div>

  <script>
    const CATEGORIES = ['அனைத்தும்', 'இலங்கைச் செய்திகள்', 'உலகச் செய்திகள்', 'கட்டுரை', 'கலை இலக்கியம்'];

    const LEGACY_CATEGORY_MAP = {
      'தமிழ்ப் பண்பாடு': 'இலங்கைச் செய்திகள்',
      'இலங்கைத் தமிழர்': 'இலங்கைச் செய்திகள்',
      'கலாச்சாரம் & மரபு': 'உலகச் செய்திகள்',
      'தமிழகம்': 'கட்டுரை',
      'இலக்கியம் & கலை': 'கலை இலக்கியம்'
    };

    const FALLBACK_NEWS = [
      {
        "id": "1795576931255",
        "title": "மாவீரர்களின் பெற்றோர்கள் அரசடித்தீவு கிட்டு சந்தியில் அமைக்கப்பட்டுள்ள குறித்த அஞ்சலி நினைவிடத்தில் உயிரிழந்த தமது உறவுகளுக்கு அஞ்சலி செலுத்த முடியும்.",
        "description": "பட்டிப்பளை பிரதேச சபை தவிசாளர் திரேஷகுமாரன் மற்றும் கிராமத்தின் முன்னோடிகள் இளைஞர்கள் என உணர்வு பூர்வமாக அனுஷ்டிக்கப்பட்ட மாவீரர் வார ஆரம்ப நிகழ்வு.\n\nமட்டக்களப்பு அரசடித்தீவு கிராமத்தில் மாவீரர் வாரத்தை முன்னிட்டு அமைக்கப்பட்டுள்ள அஞ்சலி நிகழ்விடத்தில் அஞ்சலி நிகழ்வுகள் நடைபெற்றன.",
        "category": "இலங்கைச் செய்திகள்",
        "image": "images/1795615196210_Screenshot_20261125_055721_Facebook.jpg",
        "breaking": true,
        "source": "சர்வநிச்சயம் செய்திகள்",
        "publishedAt": "2026-11-25T03:22:11.255Z"
      },
      {
        "id": "1795539718680",
        "title": "வாகரை பால்சேனை குடும்பத் தகராறு காரணமாக இளம் பெண் அடித்துக் கொலை – கணவர் கைது!",
        "description": "மட்டக்களப்பு, வாகரை பொலிஸ் பிரிவுக்குட்பட்ட பால்சேனை பகுதியில் குடும்பத் தகராறு காரணமாக இளம் பெண் அடித்துக் கொலை செய்யப்பட்டுள்ளார்.",
        "category": "இலங்கைச் செய்திகள்",
        "image": "images/1795539682806_1000750117.jpg",
        "breaking": false,
        "source": "சர்வநிச்சயம் செய்திகள்",
        "publishedAt": "2026-11-24T17:01:58.680Z"
      }
    ];

    let allArticles = [];
    let selectedCategory = 'அனைத்தும்';
    const sharePayloadMap = {};

    function normalizeCategory(cat) {
      const clean = String(cat || '').trim();
      if (CATEGORIES.includes(clean) && clean !== 'அனைத்தும்') return clean;
      if (LEGACY_CATEGORY_MAP[clean]) return LEGACY_CATEGORY_MAP[clean];
      return 'இலங்கைச் செய்திகள்';
    }

    function normalizeArticle(article) {
      if (!article || typeof article !== 'object') return null;
      const title = String(article.title || '').trim();
      const description = String(article.description || article.content || '').trim();
      if (!title && !description) return null;
      return {
        ...article,
        title: title || 'தலைப்பில்லாத செய்தி',
        description,
        category: normalizeCategory(article.category),
        source: String(article.source || 'சர்வநிச்சயம் செய்திகள்').trim()
      };
    }

    function setNotice(msg = '') {
      const el = document.getElementById('statusNotice');
      if (!msg) {
        el.textContent = '';
        el.style.display = 'none';
        return;
      }
      el.textContent = msg;
      el.style.display = 'block';
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getArticleId(article, fallbackIndex = 0) {
      const raw = article.id || article.url || article.title || `news-${fallbackIndex}`;
      try {
        return 'sn_like_' + btoa(unescape(encodeURIComponent(String(raw)))).replace(/[^a-zA-Z0-9]/g, '').slice(0, 24);
      } catch {
        return `sn_like_${fallbackIndex}`;
      }
    }

    function getLikeState(key) {
      try {
        const saved = JSON.parse(localStorage.getItem(key) || '{}');
        return { liked: Boolean(saved.liked), count: Number(saved.count) || 0 };
      } catch {
        return { liked: false, count: 0 };
      }
    }

    function toggleLike(event, key) {
      event.stopPropagation();
      const state = getLikeState(key);
      const nextLiked = !state.liked;
      const nextCount = nextLiked ? state.count + 1 : Math.max(0, state.count - 1);
      try {
        localStorage.setItem(key, JSON.stringify({ liked: nextLiked, count: nextCount }));
      } catch {}
      applyFilters();
      const modal = document.getElementById('newsModal');
      if (modal.classList.contains('open') && modal.dataset.currentIndex !== undefined) {
        const idx = Number(modal.dataset.currentIndex);
        if (allArticles[idx]) {
          const shareKey = `modal_${key}_${idx}`;
          document.getElementById('modalActions').innerHTML = renderLikeShareHtml(allArticles[idx], key, shareKey);
        }
      }
    }

    async function shareArticle(event, shareKey) {
      event.stopPropagation();
      const payload = sharePayloadMap[shareKey] || {};
      const title = payload.title || 'சர்வநிச்சயம் செய்திகள்';
      const shareUrl = payload.link && String(payload.link).trim() ? String(payload.link).trim() : window.location.href;

      if (navigator.share) {
        try {
          await navigator.share({ title, url: shareUrl });
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return;
        }
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        try {
          await navigator.clipboard.writeText(shareUrl);
          alert('இணைப்பு நகலெடுக்கப்பட்டது.');
          return;
        } catch (err) {}
      }
      prompt('இந்த இணைப்பை நகலெடுக்கவும்:', shareUrl);
    }

    function renderLikeShareHtml(article, key, shareKey) {
      const state = getLikeState(key);
      sharePayloadMap[shareKey] = {
        title: String(article.title || 'சர்வநிச்சயம் செய்திகள்'),
        link: String(article.url || article.link || window.location.href)
      };
      return `
        <button type="button" class="icon-action-btn ${state.liked ? 'liked' : ''}" onclick="toggleLike(event, '${key}')">
          <span>${state.liked ? '♥' : '♡'}</span>
          <span>${state.count}</span>
        </button>
        <button type="button" class="icon-action-btn" onclick="shareArticle(event, '${shareKey}')">
          <span>பகிர்</span>
        </button>
      `;
    }

    function updateClock() {
      const now = new Date();
      document.getElementById('clockText').textContent = now.toLocaleString('ta-IN', {
        weekday: 'short', year: 'numeric', month: 'long', day: 'numeric',
        hour: '2-digit', minute: '2-digit'
      });
    }

    function toggleTheme() {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      document.getElementById('themeBtn').textContent = isDark ? '☀️ பகல்' : '🌙 இரவு';
      try {
        localStorage.setItem('sn_theme', isDark ? 'dark' : 'light');
      } catch {}
    }

    function renderCategories() {
      const tabs = document.getElementById('categoryTabs');
      tabs.innerHTML = CATEGORIES.map((cat, i) => `
        <button type="button" class="cat-btn ${cat === selectedCategory ? 'active' : ''}" onclick="selectCategory(${i})">${escapeHtml(cat)}</button>
      `).join('');
    }

    function selectCategory(catIndex) {
      selectedCategory = CATEGORIES[catIndex] || 'அனைத்தும்';
      renderCategories();
      applyFilters();
    }

    function formatDate(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return '';
      return d.toLocaleDateString('ta-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    }

    function openArticleModalByIndex(index) {
      const article = allArticles[index];
      if (!article) return;
      const key = getArticleId(article, index);
      const shareKey = `modal_${key}_${index}`;
      const modal = document.getElementById('newsModal');
      modal.dataset.currentIndex = String(index);

      document.getElementById('modalCat').textContent = article.category || '';
      document.getElementById('modalTitle').textContent = article.title || '';
      document.getElementById('modalDesc').textContent = article.description || '';
      document.getElementById('modalMeta').innerHTML = `
        <span>${escapeHtml(article.source || 'சர்வநிச்சயம் செய்திகள்')}</span>
        <span>${escapeHtml(formatDate(article.publishedAt))}</span>
      `;
      const imgEl = document.getElementById('modalImg');
      if (article.image && String(article.image).trim()) {
        imgEl.src = String(article.image).trim();
        imgEl.alt = article.title || '';
        imgEl.style.display = 'block';
        imgEl.onerror = () => { imgEl.style.display = 'none'; };
      } else {
        imgEl.src = '';
        imgEl.style.display = 'none';
      }
      document.getElementById('modalActions').innerHTML = renderLikeShareHtml(article, key, shareKey);
      modal.classList.add('open');
    }

    function closeModal(e) {
      if (!e || e.target.id === 'newsModal') {
        document.getElementById('newsModal').classList.remove('open');
      }
    }

    function renderBreaking(articles) {
      const bar = document.getElementById('breakingBar');
      const textEl = document.getElementById('breakingText');
      if (!Array.isArray(articles) || !articles.length) {
        bar.style.display = 'none';
        return;
      }
      const idx = articles.findIndex(a => a && a.breaking);
      const specialIndex = idx >= 0 ? idx : 0;
      const special = articles[specialIndex];
      if (!special || !special.title) {
        bar.style.display = 'none';
        return;
      }
      textEl.textContent = special.title;
      textEl.onclick = () => openArticleModalByIndex(specialIndex);
      bar.style.display = 'flex';
    }

    function applyFilters() {
      const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
      const filteredWithIndex = allArticles
        .map((item, originalIndex) => ({ item, originalIndex }))
        .filter(({ item }) => {
          const matchesCat = selectedCategory === 'அனைத்தும்' || item.category === selectedCategory;
          const hay = `${item.title || ''} ${item.description || ''} ${item.category || ''}`.toLowerCase();
          const matchesQuery = !q || hay.includes(q);
          return matchesCat && matchesQuery;
        });

      document.getElementById('newsCount').textContent = `${filteredWithIndex.length} செய்திகள்`;
      const grid = document.getElementById('newsGrid');

      if (!filteredWithIndex.length) {
        grid.innerHTML = '<div class="empty-box">பொருத்தமான செய்திகள் எதுவும் இல்லை.</div>';
        return;
      }

      grid.innerHTML = '';
      filteredWithIndex.forEach(({ item, originalIndex }) => {
        const key = getArticleId(item, originalIndex);
        const shareKey = `card_${key}_${originalIndex}`;
        const card = document.createElement('div');
        card.className = 'card';
        card.onclick = () => openArticleModalByIndex(originalIndex);

        const imgSrc = item.image && String(item.image).trim() ? String(item.image).trim() : '';
        const imgHtml = imgSrc
          ? `<img src="${escapeHtml(imgSrc)}" alt="${escapeHtml(item.title || '')}" loading="lazy" onerror="this.style.display='none'" />`
          : '';

        card.innerHTML = `
          ${imgHtml}
          <div class="card-body">
            <div class="card-cat">${escapeHtml(item.category || 'இலங்கைச் செய்திகள்')}</div>
            <h4 class="card-title">${escapeHtml(item.title || '')}</h4>
            <div class="card-desc">${escapeHtml(item.description || '')}</div>
            <div class="card-meta">
              <span>${escapeHtml(item.source || 'சர்வநிச்சயம் செய்திகள்')}</span>
              <span>${escapeHtml(formatDate(item.publishedAt))}</span>
            </div>
            <div class="card-actions">
              ${renderLikeShareHtml(item, key, shareKey)}
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function loadNews(showLoadingNotice = false) {
      if (showLoadingNotice) {
        setNotice('செய்திகள் புதுப்பிக்கப்படுகின்றன...');
      }
      try {
        const res = await fetch(`./news.json?v=${Date.now()}`, { cache: 'no-store' });
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}`);
        }
        const rawText = await res.text();
        let data;
        try {
          data = JSON.parse(rawText);
        } catch (parseErr) {
          throw new Error('news.json கோப்பில் JSON வடிவமைப்பு பிழை உள்ளது.');
        }

        const list = Array.isArray(data) ? data : (Array.isArray(data.articles) ? data.articles : []);
        const normalized = list.map(normalizeArticle).filter(Boolean);

        if (normalized.length) {
          allArticles = normalized;
          setNotice('');
        } else {
          allArticles = FALLBACK_NEWS.map(normalizeArticle).filter(Boolean);
          setNotice('news.json கோப்பில் செய்திகள் காலியாக உள்ளதால் இயல்புநிலைச் செய்திகள் காட்டப்படுகின்றன.');
        }
      } catch (err) {
        allArticles = FALLBACK_NEWS.map(normalizeArticle).filter(Boolean);
        const reason = err && err.message ? err.message : 'கோப்பை ஏற்ற முடியவில்லை';
        setNotice(`news.json ஏற்றுவதில் சிக்கல் (${reason}). தற்காலிகச் செய்திகள் காட்டப்படுகின்றன.`);
      }
      renderBreaking(allArticles);
      applyFilters();
    }

    try {
      if (localStorage.getItem('sn_theme') === 'dark') {
        document.body.classList.add('dark');
        document.getElementById('themeBtn').textContent = '☀️ பகல்';
      }
    } catch {}

    allArticles = FALLBACK_NEWS.map(normalizeArticle).filter(Boolean);
    updateClock();
    setInterval(updateClock, 60000);
    renderCategories();
    renderBreaking(allArticles);
    applyFilters();
    loadNews(false);
  </script>
</body>
</html>
